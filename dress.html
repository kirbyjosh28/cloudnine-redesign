  <style>

    /* ── DRESS DETAIL PAGE — Galia Lahav editorial style ── */
    body { overflow-x: hidden; }

    .dp-wrap {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
      min-height: calc(100vh - 96px);
    }

    /* ── LEFT: Stacked magazine photos ── */
    .dp-gallery {
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dp-photo-full {
      width: 100%;
      overflow: hidden;
      background: #ebebeb;
      line-height: 0;
    }
    .dp-photo-full img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .dp-photo-full.dp-photo-wide img {
      aspect-ratio: 3/2; /* landscape accent shot */
    }

    .dp-photo-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      background: #e0e0e0;
    }
    .dp-photo-pair > div {
      overflow: hidden;
      background: #ebebeb;
      line-height: 0;
    }
    .dp-photo-pair img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ── RIGHT: Sticky editorial info panel ── */
    .dp-info {
      position: sticky;
      top: 96px;
      height: calc(100vh - 96px);
      overflow-y: auto;
      background: var(--bg, #fdfbf7);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 56px 52px 48px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .dp-info::-webkit-scrollbar { width: 3px; }
    .dp-info::-webkit-scrollbar-thumb { background: var(--border); }

    /* Back nav */
    .dp-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-kicker);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--text-light);
      cursor: pointer;
      transition: color .2s;
      margin-bottom: 52px;
      text-decoration: none;
    }
    .dp-back:hover { color: var(--teal-deep); }
    .dp-back svg { transition: transform .2s; }
    .dp-back:hover svg { transform: translateX(-3px); }

    /* Designer eyebrow */
    .dp-designer {
      display: block;
      font-family: var(--font-kicker);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--teal-deep);
      margin-bottom: 6px;
    }
    .dp-designer:empty { display: none; }

    /* Gown title */
    .dp-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 3vw, 48px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.02em;
      text-wrap: balance;
      color: var(--text);
      margin-bottom: 8px;
    }
    .dp-title em { font-style: italic; color: var(--teal-deep); }

    /* Style number */
    .dp-style-num:empty { display: none; }
    .dp-style-num {
      font-family: var(--font-kicker);
      font-size: 11px; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: var(--text-light);
      margin-bottom: 18px;
    }

    /* Thin rule */
    .dp-rule {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* Description */
    .dp-desc {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.75;
      letter-spacing: .01em;
      text-wrap: pretty;
      margin: 0 0 20px;
    }
    .dp-desc:empty { display: none; }

    /* Meta details table */
    .dp-meta {
      display: flex;
      flex-direction: column;
    }
    .dp-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .dp-meta-row:first-child { border-top: 1px solid var(--border); }
    .dp-meta-key {
      font-family: var(--font-kicker);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--text-light);
    }
    .dp-meta-val {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .02em;
    }

    /* Zero-Lag CSS Grid Accordion */
    .dp-accordion { margin: 8px 0 28px; }
    .dp-acc-item { border-bottom: 1px solid var(--border); }
    .dp-acc-trigger {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      background: none; border: none;
      font-family: var(--font-kicker);
      font-size: 11px; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: var(--text);
      cursor: pointer; transition: color .2s;
    }
    .dp-acc-trigger:hover { color: var(--teal-deep); }
    .dp-acc-icon {
      font-size: 20px; font-weight: 200; line-height: 1;
      transition: transform .35s cubic-bezier(.2,0,0,1);
      flex-shrink: 0;
    }
    .dp-acc-item.open .dp-acc-icon { transform: rotate(45deg); }
    .dp-acc-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .36s cubic-bezier(.2,0,0,1);
    }
    .dp-acc-inner {
      overflow: hidden;
      padding: 0;
      font-size: 14px; font-weight: 400;
      color: var(--text-muted); line-height: 1.75;
      transition: padding .36s cubic-bezier(.2,0,0,1);
    }
    .dp-acc-item.open .dp-acc-body { grid-template-rows: 1fr; }
    .dp-acc-item.open .dp-acc-inner { padding: 0 0 20px; }

    /* Double-Bezel Atelier Consultation Card */
    .dp-atelier-card {
      margin-top: 8px;
    }
    .dp-atelier-inner {
      padding: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #faf7f2 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dp-atelier-kicker {
      font-family: var(--font-kicker);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--teal-deep);
      text-align: center;
      margin-bottom: 2px;
    }

    /* Actions */
    .dp-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dp-actions .btn-primary,
    .dp-actions .btn-outline {
      justify-content: center;
      text-align: center;
    }
    #dpSaveBtn.active {
      background: var(--teal-deep);
      color: #ffffff;
      border-color: var(--teal-deep);
    }
    #dpSaveBtn.active svg {
      fill: #ffffff;
      stroke: #ffffff;
    }

    .dp-disclaimer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-light);
      line-height: 1.7;
      letter-spacing: .01em;
    }
    .dp-disclaimer a {
      color: var(--teal-deep);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ── Gallery column wrapper & mobile controls ── */
    .dp-gallery-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .dp-gallery-stage {
      position: relative;
      width: 100%;
    }
    .dp-mobile-topbar {
      display: none;
    }
    .dp-gal-arrow,
    .dp-gal-badge,
    .dp-gal-zoom-btn {
      display: none;
    }

    /* Thumbnail strip at bottom of gallery for mobile */
    .dp-thumbs {
      display: none;
      gap: 8px;
      padding: 10px 16px;
      background: #f5f2ec;
      border-top: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .dp-thumbs::-webkit-scrollbar { display: none; }
    .dp-thumb-btn {
      padding: 0;
      width: 54px;
      height: 72px;
      flex-shrink: 0;
      cursor: pointer;
      opacity: .56;
      transition: opacity .2s, border-color .2s, transform .15s;
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      background: #e5e2dc;
      -webkit-tap-highlight-color: transparent;
    }
    .dp-thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .dp-thumb-btn:hover,
    .dp-thumb-btn.active {
      opacity: 1;
      border-color: var(--teal-deep);
      transform: translateY(-1px);
    }

    /* ── Previous / Next Gown Stepper ── */
    .dp-neighbor-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .dp-neighbor-nav:empty { display: none; }
    .dp-neighbor-btn {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-height: 58px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      text-decoration: none;
      color: var(--text);
      transition: border-color .2s, background .2s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .dp-neighbor-btn:hover {
      border-color: var(--teal-deep);
      background: var(--teal-xlight);
    }
    .dp-neighbor-btn:active {
      transform: scale(0.98);
    }
    .dp-neighbor-btn.is-next {
      text-align: right;
      align-items: flex-end;
    }
    .dp-neighbor-dir {
      font-family: var(--font-kicker);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--teal-deep);
    }
    .dp-neighbor-name {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* ── MOBILE STICKY CTA BAR ── */
    @media (max-width: 960px) {
      .dp-mobile-cta {
        position: fixed; bottom: 0; left: 0; right: 0;
        z-index: 190;
        display: flex; align-items: stretch;
        background: rgba(253, 251, 247, 0.94);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border-top: 1px solid rgba(28, 78, 80, 0.12);
        box-shadow: 0 -8px 28px rgba(13, 46, 48, 0.10);
        padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
      }
      .dp-mobile-cta-btn {
        width: 54px;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        border-right: 1px solid var(--border);
        color: var(--teal-deep);
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s, color 0.15s, transform 0.12s;
        -webkit-tap-highlight-color: transparent;
      }
      .dp-mobile-cta-btn:active {
        background: rgba(28, 78, 80, 0.08);
        transform: scale(0.96);
      }
      .dp-mobile-cta-heart.active svg {
        fill: var(--teal-deep);
        stroke: var(--teal-deep);
      }
      .dp-mobile-cta-book {
        flex: 1;
        display: flex; align-items: center; justify-content: center;
        background: var(--teal-deep); color: #fff;
        font-family: var(--font-kicker);
        font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
        min-height: 52px; text-decoration: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: background .2s, transform 0.12s;
      }
      .dp-mobile-cta-book:active {
        background: var(--teal-darker);
        transform: scale(0.98);
      }
      /* Push content above the sticky bar */
      .dp-info { padding-bottom: 96px; }
    }
    @media (min-width: 961px) {
      .dp-mobile-cta { display: none; }
    }

    /* ── Image counter badge (desktop hover) ── */
    .dp-img-counter {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,.42); backdrop-filter: blur(6px);
      color: #fff; padding: 4px 10px; border-radius: 0;
      font-family: var(--font-kicker);
      font-size: 11px; font-weight: 700; letter-spacing: .12em;
      pointer-events: none; opacity: 0;
      transition: opacity .3s;
    }
    .dp-photo-full:hover .dp-img-counter { opacity: 1; }

    /* ── LIGHTBOX (LACE & DETAIL INSPECTOR) ── */
    .lb-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(5,5,5,.96); z-index: 3000;
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    .lb-backdrop.open { display: flex; }
    .lb-img-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }
    .lb-img {
      max-width: 90vw; max-height: 84vh;
      object-fit: contain; cursor: zoom-in;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }
    .lb-zoom-pill {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 46, 48, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-family: var(--font-kicker);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 100px;
      pointer-events: none;
      z-index: 3010;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: opacity 0.3s ease;
    }
    .lb-top {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.6) 0%, transparent 100%);
      z-index: 3010;
    }
    .lb-top-title {
      font-family: var(--font-serif);
      font-size: 15px; font-weight: 700; font-style: italic;
      color: rgba(255,255,255,.85);
    }
    .lb-counter {
      font-family: var(--font-kicker);
      font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(255,255,255,.7);
    }
    .lb-close {
      min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 8px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.9); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-kicker);
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      line-height: 1; transition: background .2s, color .2s;
    }
    .lb-close:hover { background: rgba(255,255,255,.22); color: #fff; }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.9); min-width: 44px; min-height: 44px;
      padding: 0 10px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-kicker);
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: background .2s;
      z-index: 3010;
    }
    .lb-nav:hover { background: rgba(255,255,255,.22); color: #fff; }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }

    /* ── Breadcrumb ── */
    .dp-breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-kicker);
      font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--text-light); margin-bottom: 28px;
    }
    .dp-breadcrumb a {
      display: inline-flex; align-items: center; min-height: 44px;
      color: var(--text-light); text-decoration: none; transition: color .2s;
    }
    .dp-breadcrumb a:hover { color: var(--teal-deep); }
    .dp-breadcrumb-sep { color: var(--border); }

    .dp-acc-trigger { min-height: 48px; }

    /* ── MOBILE FULL-PAGE EDITORIAL LAYOUT (<= 960px) ── */
    @media (max-width: 960px) {
      .dp-wrap { grid-template-columns: 1fr; }

      /* Compact Top Navigation Bar above the photo gallery */
      .dp-mobile-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 12px;
        background: var(--bg, #fdfbf7);
        border-bottom: 1px solid var(--border);
        min-height: 48px;
      }
      .dp-mobile-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        font-family: var(--font-kicker);
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: .10em;
        text-transform: uppercase;
        color: var(--teal-deep);
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }
      .dp-mobile-back svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .dp-mobile-quick-nav {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .dp-mobile-pos {
        font-family: var(--font-kicker);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--text-light);
        margin-right: 4px;
      }
      .dp-quick-nav-btn {
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        color: var(--teal-deep);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background .15s, opacity .15s;
      }
      .dp-quick-nav-btn:disabled {
        opacity: 0.32;
        pointer-events: none;
      }
      .dp-quick-nav-btn:active {
        background: var(--teal-xlight);
      }

      /* Horizontal Scroll-Snap Swipeable Hero Gallery on Mobile */
      .dp-gallery {
        display: flex;
        flex-direction: row;
        gap: 0;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .dp-gallery::-webkit-scrollbar { display: none; }
      .dp-photo-full {
        flex: 0 0 100%;
        width: 100%;
        scroll-snap-align: center;
        scroll-snap-stop: always;
      }
      .dp-photo-full img {
        aspect-ratio: 3/4;
        max-height: 72vh;
        object-fit: cover;
        object-position: top center;
      }
      .dp-img-counter { display: none; }

      /* Mobile Gallery Overlay Controls */
      .dp-gal-badge {
        display: inline-flex;
        align-items: center;
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 5;
        background: rgba(13, 46, 48, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #fff;
        padding: 5px 12px;
        border-radius: 999px;
        font-family: var(--font-kicker);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .10em;
        pointer-events: none;
      }
      .dp-gal-zoom-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        position: absolute;
        bottom: 12px;
        right: 12px;
        z-index: 5;
        min-height: 44px;
        padding: 0 15px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(28, 78, 80, 0.15);

        font-family: var(--font-kicker);
        font-size: 12px;
        font-weight: 700;

        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .dp-gal-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 5;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(28, 78, 80, 0.14);
        color: var(--teal-deep);
        font-size: 20px;
        line-height: 1;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);

        -webkit-tap-highlight-color: transparent;

      .dp-gal-prev { left: 10px; }
      .dp-gal-next { right: 10px; }

      .dp-thumbs.has-multiple { display: flex; }

      .dp-breadcrumb { display: none; }

      .dp-info {

        height: auto;
        border-left: none;
        border-top: 1px solid var(--border);
        padding: 24px var(--mob-gutter, 16px) 104px;
      }
      .dp-designer {
        font-size: 12.5px;
        letter-spacing: .14em;
      }
      .dp-title {
        font-size: clamp(26px, 7vw, 36px);

      .dp-style-num {
        font-size: 12.5px;
        letter-spacing: .14em;
      }
      .dp-desc {

      .dp-acc-trigger {
        font-size: 13px;
        letter-spacing: .12em;
      }
      .dp-acc-inner {
        font-size: 15px;
        font-weight: 400;
        line-height: 1.65;
      }

        letter-spacing: .14em;

<body class="page-dress">
  <header id="site-header"></header>

  <main id="main-content">
    <!-- ── MOBILE TOP BACK & STEPPER BAR ── -->
    <div class="dp-mobile-topbar" id="dpMobileTopbar">
      <a href="bridal-catalog.html" class="dp-mobile-back" id="dpMobileBackLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span id="dpMobileBackLabel">Back to Collection</span>
      </a>
      <div class="dp-mobile-quick-nav" id="dpMobileQuickNav" style="display:none;">
        <span class="dp-mobile-pos" id="dpMobilePos"></span>
        <button type="button" class="dp-quick-nav-btn" id="dpMobilePrevDress" aria-label="Previous style" disabled>&lsaquo;</button>
        <button type="button" class="dp-quick-nav-btn" id="dpMobileNextDress" aria-label="Next style" disabled>&rsaquo;</button>
      </div>
    </div>

    <div class="dp-wrap" id="dpWrap">

      <!-- ── LEFT: Editorial photo gallery + mobile swipe controls ── -->
      <div class="dp-gallery-col">
        <div class="dp-gallery-stage">
          <div class="dp-gallery" id="dpGallery">
            <!-- Injected by JS -->
          </div>
          <div class="dp-gal-badge" id="dpGalBadge" style="display:none;">1 / 1</div>
          <button type="button" class="dp-gal-arrow dp-gal-prev" id="dpGalPrev" aria-label="Previous photo" style="display:none;">&lsaquo;</button>
          <button type="button" class="dp-gal-arrow dp-gal-next" id="dpGalNext" aria-label="Next photo" style="display:none;">&rsaquo;</button>
          <button type="button" class="dp-gal-zoom-btn" id="dpGalZoomBtn" aria-label="Inspect dress details in full screen">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            <span>Zoom</span>
          </button>
        </div>
        <div class="dp-thumbs" id="dpThumbs" role="region" aria-label="Gown angle thumbnails"></div>
      </div>

      <!-- ── RIGHT: Sticky product info ── -->
      <div class="dp-info" id="dpInfo">

        <!-- Breadcrumb injected by JS into #dpBreadcrumb -->
        <div class="dp-breadcrumb" id="dpBreadcrumb"></div>

        <div class="dp-designer" id="dpDesigner">Cloud Nine Bridal</div>
        <h1 class="dp-title" id="dpTitle">Gown Detail</h1>
        <div class="dp-style-num" id="dpStyleNum"></div>
        <p class="dp-desc" id="dpDesc"></p>
        <p class="dp-stock-prominent" style="font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--teal-deep);background:var(--teal-xlight);border:1px solid var(--border);padding:12px 16px;margin:0 0 20px;line-height:1.55;">Not all gowns are kept in store. <a href="contact.html" id="dpStockContactLink" style="color:var(--teal-deep);text-decoration:underline;font-weight:700;">Contact us</a> for stock and availability details.</p>

        <div class="dp-rule"></div>

        <div class="dp-meta" id="dpMeta"></div>

        <div class="dp-accordion" id="dpAccordion"></div>

        <div class="dp-atelier-card double-bezel">
          <div class="double-bezel-inner dp-atelier-inner">
            <div class="dp-atelier-kicker">Peoria Atelier Concierge</div>
            <div class="dp-actions">
              <a href="contact.html" id="dpInquireBtn" class="btn-luxury-pill" style="justify-content:center;text-align:center;width:100%;min-height:48px;"><span>Inquire About This Style</span></a>
              <button id="dpShareBtn" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:1px solid var(--border);border-radius:9999px;background:#fff;cursor:pointer;color:var(--text-muted);font-family:var(--font-kicker);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:border-color .2s,color .2s,transform .18s;width:100%;min-height:46px;" aria-label="Share this style">
                Share This Style
              </button>
            </div>
          </div>
        </div>

        <nav class="dp-neighbor-nav" id="dpNeighborNav" aria-label="Adjacent catalog styles"></nav>
      </div>

    </div>
  </main>

  <!-- Mobile sticky CTA -->
  <div class="dp-mobile-cta" id="dpMobileCta">

    </button>
    <a href="contact.html" id="dpMobileBookBtn" class="dp-mobile-cta-book">Inquire About This Style</a>
  </div>

  <!-- Lightbox (Lace & Detail Inspector) -->
  <div class="lb-backdrop" id="lb">
    <div class="lb-top">
      <div class="lb-top-title" id="lbTitle"></div>
      <div style="display:flex;align-items:center;gap:12px;">

    </div>
    <button class="lb-nav lb-next" id="lbNextBtn" aria-label="Next photo">Next</button>
  </div>

  <footer id="site-footer"></footer>
